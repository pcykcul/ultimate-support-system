services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://uss:uss@db:5432/uss
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-change-me}
      APP_URL: ${APP_URL:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Support <support@example.com>}
      INBOUND_EMAIL_SECRET: ${INBOUND_EMAIL_SECRET:-dev-only-change-me}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: uss
      POSTGRES_PASSWORD: uss
      POSTGRES_DB: uss
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uss"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
